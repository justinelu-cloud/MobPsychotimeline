<style>
    /* STREAMING_CHUNK:Defining core CSS layout, fallback modal hiding, and scrollbar styles... */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
    }
    .hidden {
        display: none !important;
    }
    .gantt-grid {
        background-size: 40px 100%;
        background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px);
    }
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }
    .task-row:hover {
        background-color: #f8fafc;
    }
    .task-row.selected {
        background-color: #eff6ff;
    }
    .pane-resizer {
        width: 5px;
        cursor: col-resize;
        background-color: #e2e8f0;
        transition: background-color 0.2s;
    }
    .pane-resizer:hover, .pane-resizer.resizing {
        background-color: #6366f1;
    }
    .critical-bar {
        box-shadow: 0 0 0 2px #f43f5e;
    }
    .toast {
        animation: fadeInOut 3s forwards;
    }
    @keyframes fadeInOut {
        0% { opacity: 0; transform: translateY(20px); }
        10% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
    }
</style>

<!-- STREAMING_CHUNK:Building modal overlays... -->
<!-- Task Modal (Create & Edit) -->
<div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 transform transition-all">
        <div class="bg-slate-800 px-5 py-4 flex justify-between items-center text-white">
            <h3 id="modalTitle" class="font-bold text-base flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-400"></i> 編輯任務屬性
            </h3>
            <button type="button" onclick="closeTaskModal()" class="text-slate-400 hover:text-white transition text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="taskForm" onsubmit="handleTaskFormSubmit(event)" class="p-5 space-y-4 text-xs">
            <input type="hidden" id="taskId">
            
            <div>
                <label class="block font-semibold text-slate-700 mb-1">任務名稱 *</label>
                <input type="text" id="taskName" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">任務類型</label>
                    <select id="taskType" onchange="handleTaskTypeChange()" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="TASK">一般任務 (Task)</option>
                        <option value="GROUP">任務群組 (Group)</option>
                        <option value="MILESTONE">里程碑 (Milestone - 0天)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">所屬父群組</label>
                    <select id="taskParent" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">(無 - 最頂層)</option>
                    </select>
                </div>
            </div>

            <!-- Date & Duration Auto Sync Fields -->
            <div class="grid grid-cols-3 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">開始日期 *</label>
                    <input type="date" id="taskStartDate" required onchange="onStartDateChange()" class="w-full p-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">結束日期 *</label>
                    <input type="date" id="taskEndDate" required onchange="onEndDateChange()" class="w-full p-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-indigo-700 mb-1">工期 (天) *</label>
                    <input type="number" id="taskDuration" min="0" required oninput="onDurationChange()" class="w-full p-1.5 border border-indigo-300 bg-indigo-50/50 font-bold text-indigo-700 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">進度百分比 (%)</label>
                    <input type="number" id="taskProgress" min="0" max="100" value="0" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">執行狀態</label>
                    <select id="taskStatus" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="NOT_STARTED">未開始</option>
                        <option value="IN_PROGRESS">進行中</option>
                        <option value="COMPLETED">已完工</option>
                    </select>
                </div>
            </div>

            <!-- Multi-select Assignee -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block font-semibold text-slate-700">負責人 / 單位 (點擊選擇，按 ✕ 可刪除選項)</label>
                </div>
                <div id="assigneeCheckboxes" class="flex flex-wrap gap-1.5 p-2.5 bg-slate-50 border border-slate-200 rounded-lg max-h-32 overflow-y-auto custom-scrollbar">
                    <!-- Checkbox tags rendered via JS -->
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <input type="text" id="newAssigneeInput" placeholder="輸入新負責人/單位名稱..." class="flex-1 p-1.5 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="addNewAssigneeOption()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md text-xs font-medium transition">
                        + 新增選單項目
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-200">
                <div class="flex items-center gap-2">
                    <button type="button" id="btnDeleteTask" onclick="deleteCurrentTask()" class="px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-medium transition hidden">
                        <i class="fa-solid fa-trash"></i> 刪除任務
                    </button>
                    <button type="button" id="btnDuplicateTask" onclick="duplicateCurrentTaskFromModal()" class="px-3 py-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg text-xs font-medium transition hidden">
                        <i class="fa-regular fa-copy"></i> 複製群組/任務
                    </button>
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-100 transition">取消</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition shadow">儲存變更</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- JSON Import Modal -->
<div id="importModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 transform transition-all">
        <div class="bg-slate-800 px-5 py-4 flex justify-between items-center text-white">
            <h3 class="font-bold text-base flex items-center gap-2">
                <i class="fa-solid fa-file-import text-indigo-400"></i> 匯入甘特圖專案 JSON 資料
            </h3>
            <button type="button" onclick="closeImportModal()" class="text-slate-400 hover:text-white transition text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-5 space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-700 mb-1">選擇 JSON 檔案或貼上 JSON 內容：</label>
                <input type="file" id="jsonFileInput" accept=".json" onchange="importJSON(event)" class="mb-3 block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                <textarea id="jsonTextArea" rows="8" class="w-full p-2.5 border border-slate-300 rounded-lg font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="請將 JSON 文字內容貼於此處..."></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
                <button type="button" onclick="closeImportModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 transition">取消</button>
                <button type="button" onclick="handleImportJSON()" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition shadow">確認匯入</button>
            </div>
        </div>
    </div>
</div>

    /* STREAMING_CHUNK:JS Function to check URL Hash data... */
    function checkAndLoadFromURLHash() {
        try {
            var hash = window.location.hash;
            if (hash && hash.indexOf('#data=') === 0) {
                var encodedData = hash.substring(6);
                var jsonString = decodeURIComponent(atob(encodedData));
                var parsed = JSON.parse(jsonString);

                if (parsed && Array.isArray(parsed.tasks)) {
                    state.tasks = parsed.tasks;
                    if (Array.isArray(parsed.assigneeList)) {
                        state.assignees = Array.from(new Set(MOB_PSYCHO_ASSIGNEES.concat(parsed.assigneeList)));
                    }
                    if (parsed.title) {
                        var titleElem = document.getElementById('projectTitle');
                        if (titleElem) {
                            titleElem.innerHTML = parsed.title + ' <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-emerald-200">分享檢視版</span>';
                        }
                    }
                    saveToStorage();
                    showToast('已成功同步載入最新專案進度！', 'success');
                    return true;
                }
            }
        } catch(e) {
            console.error("URL Hash Parse Error:", e);
        }
        return false;
    }

    /* STREAMING_CHUNK:JS Functions for WBS Map calculation... */
    function calculateWBSMap() {
        var wbsMap = {};
        function assignWBS(parentId, prefix) {
            var children = state.tasks.filter(function(t) { return (t.parent === parentId || (!parentId && !t.parent)); });
            children.forEach(function(child, idx) {
                var currentWBS = prefix ? (prefix + '.' + (idx + 1)) : (idx + 1).toString();
                wbsMap[child.id] = currentWBS;
                assignWBS(child.id, currentWBS);
            });
        }
        assignWBS(null, '');
        return wbsMap;
    }

    function getTaskDepth(taskId) {
        var depth = 0;
        var current = state.tasks.find(function(t) { return t.id === taskId; });
        while (current && current.parent) {
            depth++;
            current = state.tasks.find(function(t) { return t.id === current.parent; });
            if (depth > 10) break;
        }
        return depth;
    }

    function getDescendantIds(parentId) {
        var descendants = [];
        var children = state.tasks.filter(function(t) { return t.parent === parentId; });
        children.forEach(function(child) {
            descendants.push(child.id);
            descendants = descendants.concat(getDescendantIds(child.id));
        });
        return descendants;
    }

    /* STREAMING_CHUNK:JS Function for rendering task list... */
    function renderTaskList() {
        var container = document.getElementById('taskListContainer');
        if (!container) return;
        container.innerHTML = '';

        var wbsMap = calculateWBSMap();

        var filteredTasks = state.tasks.filter(function(t) {
            if (state.filterAssignee) {
                if (!t.assignee || t.assignee.indexOf(state.filterAssignee) === -1) return false;
            }
            return true;
        });

        var hiddenTaskIds = new Set();
        state.tasks.forEach(function(t) {
            if (t.collapsed) {
                getDescendantIds(t.id).forEach(function(id) { hiddenTaskIds.add(id); });
            }
        });

        filteredTasks.forEach(function(task) {
            if (hiddenTaskIds.has(task.id)) return;

            var depth = getTaskDepth(task.id);
            var isSelected = state.selectedTaskId === task.id;
            var children = state.tasks.filter(function(t) { return t.parent === task.id; });
            var hasChildren = children.length > 0 || task.type === 'GROUP';

            var duration = dayjs(task.endDate).diff(dayjs(task.startDate), 'day') + 1;
            var isMilestone = task.type === 'MILESTONE';
            var wbsCode = wbsMap[task.id] || '';

            var row = document.createElement('div');
            row.className = 'task-row flex items-center px-3 py-2 text-xs border-b border-slate-100 cursor-pointer transition ' + (isSelected ? 'selected' : '');
            row.onclick = function() { selectTask(task.id); };
            row.ondblclick = function() { openTaskModal(task.id); };

            var icon = '<i class="fa-regular fa-file-lines text-slate-400 mr-1.5"></i>';
            if (task.type === 'GROUP') icon = '<i class="fa-solid fa-folder-open text-amber-500 mr-1.5"></i>';
            if (task.type === 'MILESTONE') icon = '<i class="fa-solid fa-diamond text-indigo-600 mr-1.5"></i>';

            var collapseBtn = '';
            if (hasChildren) {
                collapseBtn = '<button onclick="toggleCollapse(\'' + task.id + '\'); event.stopPropagation();" class="mr-1 text-slate-400 hover:text-slate-600 w-4 h-4 flex items-center justify-center rounded"><i class="fa-solid ' + (task.collapsed ? 'fa-chevron-right' : 'fa-chevron-down') + ' text-[10px]"></i></button>';
            } else {
                collapseBtn = '<span class="w-5 inline-block"></span>';
            }

            row.innerHTML = '' +
                '<div class="flex items-center flex-1 min-w-0 pr-2" style="padding-left: ' + (depth * 14) + 'px">' +
                    collapseBtn + icon +
                    '<span class="bg-slate-100 text-slate-600 font-mono text-[10px] px-1.5 py-0.5 rounded border border-slate-200 mr-1.5 shrink-0">' + wbsCode + '</span>' +
                    '<span class="truncate font-medium text-slate-700 hover:text-indigo-600" title="' + task.name + '">' + task.name + '</span>' +
                '</div>' +
                '<div class="w-24 text-center truncate text-slate-500 text-[11px]" title="' + (task.assignee || '-') + '">' +
                    (task.assignee ? '<span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200">' + task.assignee + '</span>' : '-') +
                '</div>' +
                '<div class="w-12 text-center font-medium text-slate-600">' + (isMilestone ? '0天' : (isNaN(duration) ? '-' : duration + '天')) + '</div>' +
                '<div class="w-12 text-right pr-1 font-semibold text-slate-700">' + (task.progress || 0) + '%</div>' +
                '<div class="w-14 text-center flex items-center justify-center space-x-1">' +
                    '<button onclick="duplicateTask(\'' + task.id + '\'); event.stopPropagation();" title="複製群組/任務" class="text-slate-400 hover:text-indigo-600 p-1 rounded hover:bg-slate-200/50 transition"><i class="fa-regular fa-copy"></i></button>' +
                    '<button onclick="createSubTask(\'' + task.id + '\'); event.stopPropagation();" title="新增子任務" class="text-slate-400 hover:text-indigo-600 p-1 rounded hover:bg-slate-200/50 transition"><i class="fa-solid fa-plus"></i></button>' +
                '</div>';

            container.appendChild(row);
        });

        updateMetrics();
    }

    /* STREAMING_CHUNK:JS Function for rendering timeline grid... */
    function renderTimeline() {
        var container = document.getElementById('timelineContainer');
        if (!container) return;
        container.innerHTML = '';

        if (state.tasks.length === 0) return;

        var minDate = dayjs('2026-04-01');
        var maxDate = dayjs('2027-06-30');

        state.tasks.forEach(function(t) {
            if (t.startDate && dayjs(t.startDate).isValid() && dayjs(t.startDate).isBefore(minDate)) minDate = dayjs(t.startDate);
            if (t.endDate && dayjs(t.endDate).isValid() && dayjs(t.endDate).isAfter(maxDate)) maxDate = dayjs(t.endDate);
        });

        minDate = minDate.subtract(3, 'day');
        maxDate = maxDate.add(7, 'day');

        var totalDays = maxDate.diff(minDate, 'day') + 1;
        
        var unitWidth = 40;
        var stepDays = 1;
        if (state.viewMode === 'week') {
            unitWidth = 90;
            stepDays = 7;
        } else if (state.viewMode === 'month') {
            unitWidth = 140;
            stepDays = 30;
        }

        var totalUnits = Math.ceil(totalDays / stepDays);
        var timelineWidth = totalUnits * unitWidth;

        var headerRow = document.createElement('div');
        headerRow.className = 'h-10 bg-slate-100 border-b border-slate-200 flex items-center sticky top-0 z-10 text-xs font-semibold text-slate-600';
        headerRow.style.width = timelineWidth + 'px';

        for (var i = 0; i < totalUnits; i++) {
            var currentDate = minDate.add(i * stepDays, 'day');
            var isToday = currentDate.isSame(dayjs(), 'day');

            var titleTop = currentDate.format('MM/DD');
            var titleSub = currentDate.format('dd');

            if (state.viewMode === 'week') {
                titleTop = '第 ' + (i + 1) + ' 週';
                titleSub = currentDate.format('MM/DD');
            } else if (state.viewMode === 'month') {
                titleTop = currentDate.format('YYYY年');
                titleSub = currentDate.format('M月');
            }

            var dayCell = document.createElement('div');
            dayCell.style.width = unitWidth + 'px';
            dayCell.className = 'text-center shrink-0 border-r border-slate-200 h-full flex flex-col justify-center ' + (isToday ? 'bg-indigo-50 font-bold text-indigo-600' : '');
            dayCell.innerHTML = '<div class="text-[10px] text-slate-400">' + titleTop + '</div><div>' + titleSub + '</div>';
            headerRow.appendChild(dayCell);
        }
        container.appendChild(headerRow);

        var hiddenTaskIds = new Set();
        state.tasks.forEach(function(t) {
            if (t.collapsed) {
                getDescendantIds(t.id).forEach(function(id) { hiddenTaskIds.add(id); });
            }
        });

        var bodyContainer = document.createElement('div');
        bodyContainer.className = 'gantt-grid relative';
        bodyContainer.style.width = timelineWidth + 'px';
        bodyContainer.style.backgroundSize = unitWidth + 'px 100%';

        state.tasks.forEach(function(task) {
            if (hiddenTaskIds.has(task.id)) return;

            var startOffsetDays = dayjs(task.startDate).diff(minDate, 'day');
            var durationDays = dayjs(task.endDate).diff(dayjs(task.startDate), 'day') + 1;

            var leftPx = (startOffsetDays / stepDays) * unitWidth;
            var widthPx = Math.max(((isNaN(durationDays) ? 1 : durationDays) / stepDays) * unitWidth - 4, 12);

            var row = document.createElement('div');
            row.className = 'h-9 border-b border-slate-100 flex items-center relative';

            if (task.type === 'MILESTONE') {
                var diamond = document.createElement('div');
                diamond.className = 'absolute w-4 h-4 bg-indigo-600 rotate-45 border-2 border-white shadow cursor-pointer hover:scale-125 transition transform';
                diamond.style.left = (leftPx + unitWidth / 2 - 8) + 'px';
                diamond.title = task.name + ' (' + task.startDate + ')';
                diamond.onclick = function() { openTaskModal(task.id); };
                row.appendChild(diamond);
            } else {
                var bar = document.createElement('div');
                var isGroup = task.type === 'GROUP';
                var bgColor = task.color || (isGroup ? '#3b82f6' : '#6366f1');
                var isCritical = state.showCriticalPath && (task.progress < 100) && (dayjs(task.endDate).isBefore(dayjs().add(14, 'day')));

                bar.className = 'absolute h-6 rounded-md shadow-xs flex items-center px-2 text-[11px] text-white font-medium cursor-pointer hover:brightness-110 transition overflow-hidden ' + (isCritical ? 'critical-bar' : '');
                bar.style.left = (Math.max(leftPx, 0) + 2) + 'px';
                bar.style.width = widthPx + 'px';
                bar.style.backgroundColor = bgColor;
                bar.onclick = function() { openTaskModal(task.id); };

                var progressOverlay = document.createElement('div');
                progressOverlay.className = 'absolute left-0 top-0 bottom-0 bg-black/20 rounded-l-md pointer-events-none';
                progressOverlay.style.width = (task.progress || 0) + '%';
                bar.appendChild(progressOverlay);

                var titleSpan = document.createElement('span');
                titleSpan.className = 'relative z-10 truncate';
                titleSpan.innerText = task.name;
                bar.appendChild(titleSpan);

                row.appendChild(bar);
            }

            bodyContainer.appendChild(row);
        });

        container.appendChild(bodyContainer);
    }

    function renderGantt() {
        renderTaskList();
        renderTimeline();
    }

    function onStartDateChange() {
        var startStr = document.getElementById('taskStartDate').value;
        var endStr = document.getElementById('taskEndDate').value;
        var durationInput = document.getElementById('taskDuration');

        if (startStr && endStr) {
            var duration = dayjs(endStr).diff(dayjs(startStr), 'day') + 1;
            if (duration < 1) {
                duration = 1;
                document.getElementById('taskEndDate').value = startStr;
            }
            durationInput.value = duration;
        }
    }

    function onEndDateChange() {
        var startStr = document.getElementById('taskStartDate').value;
        var endStr = document.getElementById('taskEndDate').value;
        var durationInput = document.getElementById('taskDuration');

        if (startStr && endStr) {
            var duration = dayjs(endStr).diff(dayjs(startStr), 'day') + 1;
            if (duration < 1) {
                duration = 1;
                document.getElementById('taskStartDate').value = endStr;
            }
            durationInput.value = duration;
        }
    }

    function onDurationChange() {
        var startStr = document.getElementById('taskStartDate').value;
        var duration = parseInt(document.getElementById('taskDuration').value) || 1;

        if (startStr && duration > 0) {
            var newEndDate = dayjs(startStr).add(duration - 1, 'day').format('YYYY-MM-DD');
            document.getElementById('taskEndDate').value = newEndDate;
        }
    }

    function handleTaskTypeChange() {
        var type = document.getElementById('taskType').value;
        var durationInput = document.getElementById('taskDuration');
        if (type === 'MILESTONE') {
            durationInput.value = 0;
            durationInput.disabled = true;
            onDurationChange();
        } else {
            durationInput.disabled = false;
            if (parseInt(durationInput.value) === 0) durationInput.value = 1;
            onDurationChange();
        }
    }

    /* STREAMING_CHUNK:JS Assignee filter functions... */
    function initAssigneeFilter() {
        var select = document.getElementById('filterAssignee');
        if (!select) return;
        select.innerHTML = '<option value="">全部負責人 / 單位</option>';
        state.assignees.forEach(function(name) {
            select.innerHTML += '<option value="' + name + '">' + name + '</option>';
        });
    }

    function renderAssigneeCheckboxes(selectedAssignees) {
        selectedAssignees = selectedAssignees || '';
        var container = document.getElementById('assigneeCheckboxes');
        if (!container) return;
        container.innerHTML = '';

        var selectedArray = selectedAssignees ? selectedAssignees.split(',').map(function(s) { return s.trim(); }) : [];

        state.assignees.forEach(function(name) {
            var isChecked = selectedArray.indexOf(name) !== -1;
            var tag = document.createElement('label');
            tag.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer transition ' + (isChecked ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300');
            tag.innerHTML = '<input type="checkbox" value="' + name + '" ' + (isChecked ? 'checked' : '') + ' onchange="updateAssigneeTagStyle(this)" class="hidden">' +
                '<span>' + name + '</span>' +
                '<i class="fa-solid fa-xmark text-[10px] ml-1 opacity-60 hover:opacity-100 hover:text-rose-300 cursor-pointer" onclick="deleteAssignee(\'' + name + '\', event)" title="刪除此選單項目"></i>';
            container.appendChild(tag);
        });
    }

    function updateAssigneeTagStyle(checkbox) {
        var label = checkbox.parentElement;
        if (checkbox.checked) {
            label.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer transition bg-indigo-600 text-white';
        } else {
            label.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer transition bg-slate-200 text-slate-700 hover:bg-slate-300';
        }
    }

    function addNewAssigneeOption() {
        var input = document.getElementById('newAssigneeInput');
        var newName = input.value.trim();
        if (newName && state.assignees.indexOf(newName) === -1) {
            state.assignees.push(newName);
            saveToStorage();
            initAssigneeFilter();
            renderAssigneeCheckboxes(getSelectedAssigneesString());
            input.value = '';
            showToast('已新增負責人/單位選項: ' + newName, 'success');
        }
    }

    function deleteAssignee(name, event) {
        if (event) event.stopPropagation();
        state.assignees = state.assignees.filter(function(a) { return a !== name; });
        saveToStorage();
        initAssigneeFilter();
        renderAssigneeCheckboxes(getSelectedAssigneesString());
        showToast('已刪除負責人選單項目：' + name, 'info');
    }

    function getSelectedAssigneesString() {
        var checkedBoxes = document.querySelectorAll('#assigneeCheckboxes input[type="checkbox"]:checked');
        return Array.from(checkedBoxes).map(function(cb) { return cb.value; }).join(', ');
    }

    function selectTask(taskId) {
        state.selectedTaskId = taskId;
        renderTaskList();
    }

    /* STREAMING_CHUNK:JS Functions for modal and tasks CRUD... */
    function toggleExpandAll() {
        var anyCollapsed = state.tasks.some(function(t) { return t.collapsed; });
        state.tasks.forEach(function(t) { t.collapsed = !anyCollapsed; });
        saveToStorage();
        renderGantt();
        showToast(anyCollapsed ? '已展開所有任務群組' : '已收合所有任務群組', 'info');
    }

    function openTaskModal(taskId) {
        taskId = taskId || null;
        var modal = document.getElementById('taskModal');
        var form = document.getElementById('taskForm');
        if (!modal || !form) return;
        form.reset();

        populateParentDropdown(taskId);

        if (taskId) {
            var task = state.tasks.find(function(t) { return t.id === taskId; });
            if (!task) return;

            document.getElementById('modalTitle').innerText = '編輯任務屬性';
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskName').value = task.name;
            document.getElementById('taskType').value = task.type || 'TASK';
            document.getElementById('taskParent').value = task.parent || '';
            document.getElementById('taskStartDate').value = task.startDate;
            document.getElementById('taskEndDate').value = task.endDate;

            var duration = dayjs(task.endDate).diff(dayjs(task.startDate), 'day') + 1;
            document.getElementById('taskDuration').value = task.type === 'MILESTONE' ? 0 : (isNaN(duration) ? 1 : duration);

            document.getElementById('taskProgress').value = task.progress || 0;
            document.getElementById('taskStatus').value = task.status || 'NOT_STARTED';

            renderAssigneeCheckboxes(task.assignee || '');
            document.getElementById('btnDeleteTask').classList.remove('hidden');
            document.getElementById('btnDuplicateTask').classList.remove('hidden');
        } else {
            document.getElementById('modalTitle').innerText = '新增任務';
            document.getElementById('taskId').value = '';
            document.getElementById('taskStartDate').value = dayjs().format('YYYY-MM-DD');
            document.getElementById('taskEndDate').value = dayjs().add(5, 'day').format('YYYY-MM-DD');
            document.getElementById('taskDuration').value = 6;

            if (state.selectedTaskId) {
                document.getElementById('taskParent').value = state.selectedTaskId;
            }

            renderAssigneeCheckboxes('');
            document.getElementById('btnDeleteTask').classList.add('hidden');
            document.getElementById('btnDuplicateTask').classList.add('hidden');
        }

        modal.classList.remove('hidden');
    }

    function closeTaskModal() {
        var modal = document.getElementById('taskModal');
        if (modal) modal.classList.add('hidden');
    }

    function populateParentDropdown(currentTaskId) {
        var select = document.getElementById('taskParent');
        if (!select) return;
        select.innerHTML = '<option value="">(無 - 最頂層)</option>';

        function addOptions(parentId, prefix) {
            var children = state.tasks.filter(function(t) {
                return (t.parent === parentId || (!parentId && !t.parent)) && t.id !== currentTaskId;
            });
            children.forEach(function(child) {
                select.innerHTML += '<option value="' + child.id + '">' + prefix + child.name + '</option>';
                addOptions(child.id, prefix + '└─ ');
            });
        }

        addOptions(null, '');
    }

    function handleTaskFormSubmit(e) {
        e.preventDefault();

        var taskId = document.getElementById('taskId').value;
        var name = document.getElementById('taskName').value;
        var type = document.getElementById('taskType').value;
        var parent = document.getElementById('taskParent').value || null;
        var startDate = document.getElementById('taskStartDate').value;
        var endDate = document.getElementById('taskEndDate').value;
        var progress = parseInt(document.getElementById('taskProgress').value) || 0;
        var status = document.getElementById('taskStatus').value;
        var assignee = getSelectedAssigneesString();

        if (taskId) {
            var task = state.tasks.find(function(t) { return t.id === taskId; });
            if (task) {
                task.name = name;
                task.type = type;
                task.parent = parent;
                task.startDate = startDate;
                task.endDate = endDate;
                task.progress = progress;
                task.status = status;
                task.assignee = assignee;
            }
        } else {
            var newId = 'T-' + Date.now().toString().slice(-5);
            var newTask = {
                id: newId,
                name: name,
                type: type,
                parent: parent,
                startDate: startDate,
                endDate: endDate,
                progress: progress,
                status: status,
                assignee: assignee,
                color: '#6366f1'
            };
            state.tasks.push(newTask);
        }

        saveToStorage();
        renderGantt();
        closeTaskModal();
        showToast('任務屬性已成功儲存！', 'success');
    }

    function createSubTask(parentId) {
        var parentTask = state.tasks.find(function(t) { return t.id === parentId; });
        if (!parentTask) return;

        parentTask.collapsed = false;

        var newId = 'T-' + Date.now().toString().slice(-5);
        var newSubTask = {
            id: newId,
            name: "新階層子任務",
            type: "TASK",
            parent: parentId,
            startDate: parentTask.startDate,
            endDate: parentTask.endDate,
            progress: 0,
            status: "NOT_STARTED",
            assignee: parentTask.assignee || "",
            color: "#6366f1"
        };

        var index = state.tasks.findIndex(function(t) { return t.id === parentId; });
        state.tasks.splice(index + 1, 0, newSubTask);

        state.selectedTaskId = newId;
        saveToStorage();
        renderGantt();
        openTaskModal(newId);
    }

    function duplicateTask(taskId) {
        var rootTask = state.tasks.find(function(t) { return t.id === taskId; });
        if (!rootTask) return;

        var subtreeIds = [taskId].concat(getDescendantIds(taskId));
        var subtreeTasks = state.tasks.filter(function(t) { return subtreeIds.indexOf(t.id) !== -1; });

        var idMap = {};
        var now = Date.now();
        subtreeTasks.forEach(function(t, idx) {
            idMap[t.id] = 'T-' + (now + idx) + '-' + Math.random().toString(36).substring(2, 5);
        });

        var clonedTasks = subtreeTasks.map(function(t) {
            var isRoot = (t.id === taskId);
            return Object.assign({}, t, {
                id: idMap[t.id],
                name: isRoot ? (t.name + ' (副本)') : t.name,
                parent: isRoot ? t.parent : idMap[t.parent]
            });
        });

        var lastIndex = -1;
        state.tasks.forEach(function(t, idx) {
            if (subtreeIds.indexOf(t.id) !== -1) lastIndex = idx;
        });

        if (lastIndex !== -1) {
            state.tasks.splice.apply(state.tasks, [lastIndex + 1, 0].concat(clonedTasks));
        } else {
            state.tasks.push.apply(state.tasks, clonedTasks);
        }

        state.selectedTaskId = idMap[taskId];
        saveToStorage();
        renderGantt();
        showToast('已連動複製群組/任務「' + rootTask.name + '」及其所有階層子項目！', 'success');
    }

    function duplicateCurrentTaskFromModal() {
        var id = document.getElementById('taskId').value;
        if (!id) return;
        closeTaskModal();
        duplicateTask(id);
    }

    function deleteCurrentTask() {
        var id = document.getElementById('taskId').value;
        if (!id) return;

        var descendantIds = getDescendantIds(id);
        var toDeleteIds = [id].concat(descendantIds);

        state.tasks = state.tasks.filter(function(t) { return toDeleteIds.indexOf(t.id) === -1; });
        saveToStorage();
        renderGantt();
        closeTaskModal();
        showToast('已刪除該任務及其所有關聯子項目！', 'info');
    }

    function toggleCollapse(taskId) {
        var task = state.tasks.find(function(t) { return t.id === taskId; });
        if (task) {
            task.collapsed = !task.collapsed;
            saveToStorage();
            renderGantt();
        }
    }

    function setupKeyboardShortcuts() {
        document.addEventListener('keydown', function(e) {
            var modal = document.getElementById('taskModal');
            var importModal = document.getElementById('importModal');
            var isModalOpen = (modal && !modal.classList.contains('hidden')) || (importModal && !importModal.classList.contains('hidden'));

            if (e.key === 'Enter' && state.selectedTaskId && !isModalOpen) {
                e.preventDefault();
                createSubTask(state.selectedTaskId);
            }
        });
    }

    function initPaneResizer() {
        var resizer = document.getElementById('paneResizer');
        var leftPane = document.getElementById('leftPane');
        if (!resizer || !leftPane) return;
        var isResizing = false;

        resizer.addEventListener('mousedown', function() {
            isResizing = true;
            resizer.classList.add('resizing');
            document.body.style.cursor = 'col-resize';
        });

        document.addEventListener('mousemove', function(e) {
            if (!isResizing) return;
            var newWidth = e.clientX;
            if (newWidth > 220 && newWidth < 700) {
                leftPane.style.width = newWidth + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('resizing');
                document.body.style.cursor = 'default';
            }
        });
    }

    function applyFilters() {
        var select = document.getElementById('filterAssignee');
        if (select) state.filterAssignee = select.value;
        renderGantt();
    }

    function scrollToToday() {
        var container = document.getElementById('rightPane');
        if (container) container.scrollLeft = 200;
    }

    function toggleCriticalPath() {
        state.showCriticalPath = !state.showCriticalPath;
        renderGantt();
        showToast(state.showCriticalPath ? '已啟用關鍵路徑高亮顯示' : '已關閉關鍵路徑顯示', 'info');
    }

    /* STREAMING_CHUNK:JS Functions for JSON Import and Export... */
    function exportJSON() {
        var titleElem = document.getElementById('projectTitle');
        var exportObj = {
            title: titleElem ? titleElem.innerText.replace("官方正式版", "").replace("分享檢視版", "").trim() : "路人超能100期間限定店專案時程",
            subtext: "展覽籌備、授權、製作、行銷與營運時程甘特圖",
            tasks: state.tasks,
            assigneeList: state.assignees
        };
        var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
        var downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "mob_psycho_100_gantt_" + dayjs().format('YYYYMMDD_HHmm') + ".json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('已匯出《路人超能100期間限定店專案時程》JSON 資料！', 'success');
    }

    function openImportModal() {
        var modal = document.getElementById('importModal');
        if (!modal) return;
        document.getElementById('jsonTextArea').value = '';
        document.getElementById('jsonFileInput').value = '';
        modal.classList.remove('hidden');
    }

    function closeImportModal() {
        var modal = document.getElementById('importModal');
        if (modal) modal.classList.add('hidden');
    }

    function importJSON(event) {
        if (event && event.target && event.target.files && event.target.files[0]) {
            var file = event.target.files[0];
            var reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    var text = evt.target.result;
                    var jsonTextArea = document.getElementById('jsonTextArea');
                    if (jsonTextArea) jsonTextArea.value = text;
                    
                    var parsed = JSON.parse(text);
                    var loadedTasks = [];

                    if (Array.isArray(parsed)) {
                        loadedTasks = parsed;
                    } else if (parsed && Array.isArray(parsed.tasks)) {
                        loadedTasks = parsed.tasks;
                        if (Array.isArray(parsed.assigneeList)) {
                            state.assignees = Array.from(new Set(state.assignees.concat(parsed.assigneeList)));
                        }
                        if (parsed.title) {
                            var titleElem = document.getElementById('projectTitle');
                            if (titleElem) {
                                titleElem.innerHTML = parsed.title + ' <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-emerald-200">官方正式版</span>';
                            }
                        }
                    } else {
                        showToast('格式錯誤：JSON 必須為任務陣列或包含 tasks 的物件', 'warning');
                        return;
                    }

                    state.tasks = loadedTasks;
                    saveToStorage();
                    initAssigneeFilter();
                    renderGantt();
                    closeImportModal();
                    showToast('已成功匯入專案 JSON 資料！', 'success');
                } catch(err) {
                    showToast('JSON 解析失敗，請確認格式是否正確', 'warning');
                }
            };
            reader.readAsText(file);
        }
    }
    window.importJSON = importJSON;

    function handleImportJSON() {
        var text = document.getElementById('jsonTextArea').value.trim();
        if (!text) {
            showToast('請貼上 JSON 內容或選擇檔案', 'warning');
            return;
        }
        try {
            var parsed = JSON.parse(text);
            var loadedTasks = [];

            if (Array.isArray(parsed)) {
                loadedTasks = parsed;
            } else if (parsed && Array.isArray(parsed.tasks)) {
                loadedTasks = parsed.tasks;
                if (Array.isArray(parsed.assigneeList)) {
                    state.assignees = Array.from(new Set(state.assignees.concat(parsed.assigneeList)));
                }
                if (parsed.title) {
                    var titleElem = document.getElementById('projectTitle');
                    if (titleElem) {
                        titleElem.innerHTML = parsed.title + ' <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-emerald-200">官方正式版</span>';
                    }
                }
            } else {
                showToast('格式錯誤：JSON 必須為任務陣列或包含 tasks 的物件', 'warning');
                return;
            }

            state.tasks = loadedTasks;
            saveToStorage();
            initAssigneeFilter();
            renderGantt();
            closeImportModal();
            showToast('已成功匯入專案 JSON 資料！', 'success');
        } catch(err) {
            showToast('JSON 解析失敗，請確認格式是否正確', 'warning');
        }
    }

    function updateMetrics() {
        var total = state.tasks.length;
        var completed = state.tasks.filter(function(t) { return t.status === 'COMPLETED'; }).length;
        var inProgress = state.tasks.filter(function(t) { return t.status === 'IN_PROGRESS'; }).length;

        var totalProgressSum = 0;
        state.tasks.forEach(function(t) { totalProgressSum += (t.progress || 0); });
        var avgProgress = total > 0 ? Math.round(totalProgressSum / total) : 0;

        var elemTotal = document.getElementById('metricTotalTasks');
        var elemInProgress = document.getElementById('metricInProgress');
        var elemCompleted = document.getElementById('metricCompleted');
        var elemBar = document.getElementById('metricProgressBar');
        var elemText = document.getElementById('metricProgressText');

        if (elemTotal) elemTotal.innerText = total;
        if (elemInProgress) elemInProgress.innerText = inProgress;
        if (elemCompleted) elemCompleted.innerText = completed;
        if (elemBar) elemBar.style.width = avgProgress + '%';
        if (elemText) elemText.innerText = avgProgress + '%';
    }

    function showToast(message, type) {
        type = type || 'info';
        var toast = document.createElement('div');
        var bgClass = type === 'success' ? 'bg-emerald-600' : type === 'warning' ? 'bg-amber-600' : 'bg-slate-800';
        toast.className = 'toast fixed bottom-5 right-5 ' + bgClass + ' text-white px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2 z-50';
        toast.innerHTML = '<i class="fa-solid fa-circle-info"></i> <span>' + message + '</span>';
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 3000);
    }
</script>
