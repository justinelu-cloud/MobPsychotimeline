<style>
    /* STREAMING_CHUNK:Defining responsive layout & scrollbar styles... */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow-x: hidden;
    }
    .gantt-grid {
        background-size: 40px 100%;
        background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px);
    }
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }
    .task-row:hover {
        background-color: #f8fafc;
    }
    .task-row.selected {
        background-color: #eff6ff;
    }
    .pane-resizer {
        width: 5px;
        cursor: col-resize;
        background-color: #e2e8f0;
        transition: background-color 0.2s;
    }
    .pane-resizer:hover, .pane-resizer.resizing {
        background-color: #6366f1;
    }
    .critical-bar {
        box-shadow: 0 0 0 2px #f43f5e;
    }
    .toast {
        animation: fadeInOut 3s forwards;
    }
    @keyframes fadeInOut {
        0% { opacity: 0; transform: translateY(20px); }
        10% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
    }
</style>
<!-- STREAMING_CHUNK:Rendering navigation header with user project title... -->
<!-- Header Toolbar -->
<header class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-sm z-20 shrink-0">
    <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
            <i class="fa-solid fa-chart-gantt text-xl"></i>
        </div>
        <div>
            <h1 id="projectTitle" class="font-bold text-slate-800 text-lg leading-tight flex items-center gap-2">
                路人超能100期間限定店專案時程
                <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-emerald-200">官方正式版</span>
            </h1>
            <p id="projectSubtext" class="text-xs text-slate-500">展覽籌備、授權、製作、行銷與營運時程甘特圖</p>
        </div>
    </div>

    <div class="flex flex-wrap items-center gap-2 text-sm">
        <!-- Share URL Link Button -->
        <button onclick="generateShareLink()" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition shadow-md flex items-center gap-1.5 ring-2 ring-emerald-300" title="產生包含當前進度的專屬網址，團隊點開即可查看">
            <i class="fa-solid fa-share-nodes"></i> 🔗 複製分享連結
        </button>

        <div class="h-4 w-px bg-slate-300 mx-1"></div>

        <!-- View Mode Selector -->
        <div class="bg-slate-100 p-1 rounded-lg flex items-center border border-slate-200">
            <button onclick="setViewMode('day')" id="btnViewDay" class="px-3 py-1 rounded-md text-xs font-semibold transition bg-white shadow-sm text-indigo-600">日 View</button>
            <button onclick="setViewMode('week')" id="btnViewWeek" class="px-3 py-1 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition">週 View</button>
            <button onclick="setViewMode('month')" id="btnViewMonth" class="px-3 py-1 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition">月 View</button>
        </div>

        <!-- Action Buttons -->
        <button onclick="toggleCriticalPath()" id="btnCriticalPath" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5">
            <i class="fa-solid fa-route text-rose-500"></i> 關鍵路徑
        </button>

        <button onclick="scrollToToday()" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5">
            <i class="fa-regular fa-calendar-check text-indigo-500"></i> 定位今天
        </button>

        <!-- Assignee Filter -->
        <select id="filterAssignee" onchange="applyFilters()" class="px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">全部負責人 / 單位</option>
        </select>

        <!-- JSON Data Operations -->
        <button onclick="exportJSON()" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-xs font-medium text-slate-700 transition flex items-center gap-1.5">
            <i class="fa-solid fa-download text-indigo-500"></i> 匯出 JSON
        </button>

        <button onclick="openImportModal()" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-xs font-medium text-slate-700 transition flex items-center gap-1.5">
            <i class="fa-solid fa-upload text-indigo-500"></i> 匯入 JSON
        </button>

        <button onclick="resetData()" class="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 text-xs font-medium transition flex items-center gap-1">
            <i class="fa-solid fa-rotate-left"></i> 重置範本
        </button>

        <button onclick="openTaskModal()" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition shadow flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> 新增任務
        </button>
    </div>
</header>

<!-- STREAMING_CHUNK:Rendering project metrics overview bar... -->
<!-- Metrics Dashboard -->
<div class="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center justify-between gap-4 text-xs shrink-0 z-10 shadow-xs">
    <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-2">
            <span class="text-slate-500">總任務數:</span>
            <span id="metricTotalTasks" class="font-bold text-slate-800 text-sm">0</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-slate-500">進行中:</span>
            <span id="metricInProgress" class="font-bold text-blue-600 text-sm">0</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-slate-500">已完工:</span>
            <span id="metricCompleted" class="font-bold text-emerald-600 text-sm">0</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-slate-500">專案總進度:</span>
            <div class="w-32 bg-slate-200 rounded-full h-2 overflow-hidden">
                <div id="metricProgressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <span id="metricProgressText" class="font-bold text-indigo-600 text-sm">0%</span>
        </div>
    </div>

    <div class="flex items-center space-x-2 text-slate-400">
        <span>快捷提示: 點擊 <i class="fa-solid fa-share-nodes text-emerald-600"></i> 「複製分享連結」即可將當前進度傳給團隊！</span>
    </div>
</div>

<!-- STREAMING_CHUNK:Constructing split workspace table and timeline... -->
<!-- Main Gantt Workspace -->
<div class="flex-1 flex overflow-hidden relative">

    <!-- Left Task Table Pane -->
    <div id="leftPane" class="w-[450px] min-w-[280px] max-w-[650px] bg-white border-r border-slate-200 flex flex-col shrink-0">
        <!-- Table Header -->
        <div class="h-10 bg-slate-100 border-b border-slate-200 flex items-center px-3 text-xs font-semibold text-slate-600 shrink-0">
            <div class="flex-1 min-w-0 flex items-center gap-1">
                <button onclick="toggleExpandAll()" title="全部展開 / 收合" class="p-1 hover:bg-slate-200 rounded transition text-slate-500">
                    <i class="fa-solid fa-arrows-up-down"></i>
                </button>
                <span>WBS / 任務名稱</span>
            </div>
            <div class="w-24 text-center">負責人/單位</div>
            <div class="w-12 text-center">工期</div>
            <div class="w-12 text-right pr-1">進度</div>
            <div class="w-14 text-center">操作</div>
        </div>
        <!-- Task Rows List -->
        <div id="taskListContainer" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-slate-100">
            <!-- Dynamically rendered task rows -->
        </div>
    </div>

    <!-- Resizer Bar -->
    <div id="paneResizer" class="pane-resizer shrink-0"></div>

    <!-- Right Timeline Pane -->
    <div id="rightPane" class="flex-1 overflow-x-auto overflow-y-auto custom-scrollbar bg-slate-50 relative">
        <div id="timelineContainer" class="min-w-full inline-block relative">
            <!-- Timeline Headers & Grid Bars rendered via JS -->
        </div>
    </div>
</div>

<!-- STREAMING_CHUNK:Building task form edit modal... -->
<!-- Task Modal (Create & Edit) -->
<div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 transform transition-all">
        <div class="bg-slate-800 px-5 py-4 flex justify-between items-center text-white">
            <h3 id="modalTitle" class="font-bold text-base flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-400"></i> 編輯任務屬性
            </h3>
            <button type="button" onclick="closeTaskModal()" class="text-slate-400 hover:text-white transition text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="taskForm" onsubmit="handleTaskFormSubmit(event)" class="p-5 space-y-4 text-xs">
            <input type="hidden" id="taskId">
            
            <div>
                <label class="block font-semibold text-slate-700 mb-1">任務名稱 *</label>
                <input type="text" id="taskName" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">任務類型</label>
                    <select id="taskType" onchange="handleTaskTypeChange()" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="TASK">一般任務 (Task)</option>
                        <option value="GROUP">任務群組 (Group)</option>
                        <option value="MILESTONE">里程碑 (Milestone - 0天)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">所屬父群組</label>
                    <select id="taskParent" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">(無 - 最頂層)</option>
                    </select>
                </div>
            </div>

            <!-- Date & Duration Auto Sync Fields -->
            <div class="grid grid-cols-3 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">開始日期 *</label>
                    <input type="date" id="taskStartDate" required onchange="onStartDateChange()" class="w-full p-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">結束日期 *</label>
                    <input type="date" id="taskEndDate" required onchange="onEndDateChange()" class="w-full p-1.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-indigo-700 mb-1">工期 (天) *</label>
                    <input type="number" id="taskDuration" min="0" required oninput="onDurationChange()" class="w-full p-1.5 border border-indigo-300 bg-indigo-50/50 font-bold text-indigo-700 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none text-center">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">進度百分比 (%)</label>
                    <input type="number" id="taskProgress" min="0" max="100" value="0" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">執行狀態</label>
                    <select id="taskStatus" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="NOT_STARTED">未開始</option>
                        <option value="IN_PROGRESS">進行中</option>
                        <option value="COMPLETED">已完工</option>
                    </select>
                </div>
            </div>

            <!-- Multi-select Assignee -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block font-semibold text-slate-700">負責人 / 單位 (點擊選擇，按 ✕ 可刪除選項)</label>
                </div>
                <div id="assigneeCheckboxes" class="flex flex-wrap gap-1.5 p-2.5 bg-slate-50 border border-slate-200 rounded-lg max-h-32 overflow-y-auto custom-scrollbar">
                    <!-- Checkbox tags rendered via JS -->
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <input type="text" id="newAssigneeInput" placeholder="輸入新負責人/單位名稱..." class="flex-1 p-1.5 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="addNewAssigneeOption()" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-md text-xs font-medium transition">
                        + 新增選單項目
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center pt-3 border-t border-slate-200">
                <div class="flex items-center gap-2">
                    <button type="button" id="btnDeleteTask" onclick="deleteCurrentTask()" class="px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-medium transition hidden">
                        <i class="fa-solid fa-trash"></i> 刪除任務
                    </button>
                    <button type="button" id="btnDuplicateTask" onclick="duplicateCurrentTaskFromModal()" class="px-3 py-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg text-xs font-medium transition hidden">
                        <i class="fa-regular fa-copy"></i> 複製群組/任務
                    </button>
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-100 transition">取消</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition shadow">儲存變更</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- STREAMING_CHUNK:Building JSON import modal dialog... -->
<!-- JSON Import Modal -->
<div id="importModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center hidden z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 transform transition-all">
        <div class="bg-slate-800 px-5 py-4 flex justify-between items-center text-white">
            <h3 class="font-bold text-base flex items-center gap-2">
                <i class="fa-solid fa-file-import text-indigo-400"></i> 匯入甘特圖專案 JSON 資料
            </h3>
            <button type="button" onclick="closeImportModal()" class="text-slate-400 hover:text-white transition text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-5 space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-700 mb-1">選擇 JSON 檔案或貼上 JSON 內容：</label>
                <input type="file" id="jsonFileInput" accept=".json" onchange="importJSON(event)" class="mb-3 block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                <textarea id="jsonTextArea" rows="8" class="w-full p-2.5 border border-slate-300 rounded-lg font-mono text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="請將 JSON 文字內容貼於此處..."></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
                <button type="button" onclick="closeImportModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 transition">取消</button>
                <button type="button"
